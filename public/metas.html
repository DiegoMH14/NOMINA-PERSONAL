<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Metas de ahorro — Nómina Personal</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="/img/logo-icon.png" alt="Nómina Personal" class="brand-mark-img">
        <div>
          <div class="brand-name">Nómina Personal</div>
          <div class="brand-sub">gestor personal</div>
        </div>
      </div>
      <nav class="nav">
      <a class="nav-item" href="/dashboard.html"><span class="nav-icon">▤</span> Dashboard</a>
      <a class="nav-item" href="/movimientos.html"><span class="nav-icon">≡</span> Movimientos</a>
      <a class="nav-item" href="/categorias.html"><span class="nav-icon">◆</span> Categorías</a>
      <a class="nav-item" href="/presupuestos.html"><span class="nav-icon">▦</span> Presupuestos</a>
      <a class="nav-item active" href="/metas.html"><span class="nav-icon">◎</span> Metas</a>
      <a class="nav-item" href="/deudas.html"><span class="nav-icon">▼</span> Deudas</a>
      <a class="nav-item" href="/pagos.html"><span class="nav-icon">◷</span> Pagos</a>
      <a class="nav-item" href="/telegram.html"><span class="nav-icon">✈</span> Telegram</a>
      <a class="nav-item nav-item-bot" href="https://t.me/NexosasBot" target="_blank" rel="noopener"><span class="nav-icon">🤖</span> @NexosasBot <span class="badge-new">Chatea</span></a>
      <a class="nav-item" href="/cambiar_password.html"><span class="nav-icon">⚙</span> Mi cuenta</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-row">
          <span class="user-name js-username"></span>
          <a href="#" class="user-logout" id="btn-logout">Cerrar sesión</a>
        </div>
      </div>
    </aside>
    <main class="content">
      <div class="page-header">
        <div>
          <div class="eyebrow">Ahorro</div>
          <h1>Metas de ahorro</h1>
        </div>
      </div>

      <div class="panel">
        <form id="form-meta" class="filter-row">
          <input type="text" id="nombre" placeholder="Nombre de la meta" required>
          <input type="number" id="monto_objetivo" placeholder="Monto objetivo" required min="0" step="1">
          <input type="date" id="fecha_objetivo" required>
          <button type="submit" class="btn btn-primary btn-sm">Crear meta</button>
        </form>
      </div>

      <div class="panel">
        <div id="lista-metas">Cargando...</div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    async function cargar() {
      const data = await apiFetch("/api/metas");
      const cont = document.getElementById("lista-metas");
      const items = data.metas || [];
      cont.innerHTML = items.length
        ? items.map(m => `
            <div class="progress-row">
              <div class="progress-head">
                <span class="progress-title">${m.completada ? '✅ ' : ''}${m.nombre}</span>
                <span class="progress-numbers">$${m.monto_actual.toLocaleString("es-CO")} / $${m.monto_objetivo.toLocaleString("es-CO")}</span>
              </div>
              <div class="progress-bar"><div class="progress-bar-fill" style="width:${Math.min(m.progreso_pct, 100)}%"></div></div>
              <div class="progress-sub">
                <span>${m.completada ? 'Completada' : `faltan ${m.dias_restantes} día(s), ~$${m.ahorro_mensual_necesario.toLocaleString("es-CO")}/mes`}</span>
              </div>
              <div class="filter-row" style="margin-top:10px;">
                <input type="number" placeholder="Aportar" min="0" style="width:110px" id="aporte-${m.id}">
                <button class="btn btn-primary btn-sm" onclick="aportar(${m.id})">Aportar</button>
                <button class="btn btn-ghost btn-sm" onclick="eliminar(${m.id})">Eliminar</button>
              </div>
            </div>`).join("")
        : '<p class="empty-hint">No tienes metas todavía.</p>';
    }

    async function aportar(id) {
      const input = document.getElementById(`aporte-${id}`);
      const monto = parseFloat(input.value);
      if (!monto) return;
      await apiFetch(`/api/metas?accion=aportar&id=${id}`, {
        method: "POST",
        body: JSON.stringify({ monto }),
      });
      cargar();
    }

    async function eliminar(id) {
      if (!confirm("¿Eliminar esta meta?")) return;
      await apiFetch(`/api/metas?id=${id}`, { method: "DELETE" });
      cargar();
    }

    document.getElementById("form-meta").addEventListener("submit", async (e) => {
      e.preventDefault();
      await apiFetch("/api/metas", {
        method: "POST",
        body: JSON.stringify({
          nombre: document.getElementById("nombre").value,
          monto_objetivo: parseFloat(document.getElementById("monto_objetivo").value),
          fecha_objetivo: document.getElementById("fecha_objetivo").value,
        }),
      });
      e.target.reset();
      cargar();
    });

    cargar();
  </script>
</body>
</html>
