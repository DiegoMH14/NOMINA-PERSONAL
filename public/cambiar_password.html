<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi cuenta — Nómina Personal</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="/img/logo-icon.png" alt="Nómina Personal" class="brand-mark-img">
        <div>
          <div class="brand-name">Nómina Personal</div>
          <div class="brand-sub">gestor personal</div>
        </div>
      </div>
      <nav class="nav">
      <a class="nav-item" href="/dashboard.html"><span class="nav-icon">▤</span> Dashboard</a>
      <a class="nav-item" href="/movimientos.html"><span class="nav-icon">≡</span> Movimientos</a>
      <a class="nav-item" href="/categorias.html"><span class="nav-icon">◆</span> Categorías</a>
      <a class="nav-item" href="/presupuestos.html"><span class="nav-icon">▦</span> Presupuestos</a>
      <a class="nav-item" href="/metas.html"><span class="nav-icon">◎</span> Metas</a>
      <a class="nav-item" href="/deudas.html"><span class="nav-icon">▼</span> Deudas</a>
      <a class="nav-item" href="/pagos.html"><span class="nav-icon">◷</span> Pagos</a>
      <a class="nav-item" href="/telegram.html"><span class="nav-icon">✈</span> Telegram</a>
      <a class="nav-item nav-item-bot" href="https://t.me/NexosasBot" target="_blank" rel="noopener"><span class="nav-icon">🤖</span> @NexosasBot <span class="badge-new">Chatea</span></a>
      <a class="nav-item active" href="/cambiar_password.html"><span class="nav-icon">⚙</span> Mi cuenta</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-row">
          <span class="user-name js-username"></span>
          <a href="#" class="user-logout" id="btn-logout">Cerrar sesión</a>
        </div>
      </div>
    </aside>
    <main class="content">
      <div class="page-header">
        <div>
          <div class="eyebrow">Seguridad</div>
          <h1>Mi cuenta</h1>
        </div>
      </div>

      <div class="panel" style="max-width:420px;">
        <h2>Cambiar contraseña</h2>
        <form id="form-pass" class="auth-form">
          <label>Contraseña actual
            <input type="password" id="password_actual" required>
          </label>
          <label>Nueva contraseña (mín. 6 caracteres)
            <input type="password" id="nueva_password" required minlength="6">
          </label>
          <button type="submit" class="btn btn-primary">Cambiar</button>
        </form>
        <p id="mensaje" style="font-size:13px; margin-top:12px;"></p>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    document.getElementById("form-pass").addEventListener("submit", async (e) => {
      e.preventDefault();
      const mensaje = document.getElementById("mensaje");
      const resp = await fetch("/api/cambiar_password", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${localStorage.getItem("np_token")}` },
        body: JSON.stringify({
          password_actual: document.getElementById("password_actual").value,
          nueva_password: document.getElementById("nueva_password").value,
        }),
      });
      const data = await resp.json();
      mensaje.style.color = resp.ok ? "var(--accent)" : "var(--danger)";
      mensaje.textContent = resp.ok ? "Contraseña actualizada." : (data.error || "Error al cambiar la contraseña");
      if (resp.ok) e.target.reset();
    });
  </script>
</body>
</html>
