<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nómina Personal — Iniciar sesión</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-shell">
    <main class="auth-box">
      <img src="/img/logo-icon.png" alt="Nómina Personal" class="auth-logo-img">
      <h1 class="auth-title">Nómina Personal</h1>
      <p class="auth-hint">Inicia sesión para ver tus cuentas y movimientos.</p>
      <form id="form-login" class="auth-form">
        <label>Usuario
          <input type="text" id="username" required>
        </label>
        <label>Contraseña
          <input type="password" id="password" required>
        </label>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>
      <p id="mensaje" style="color:#e05555; font-size:13px; margin-top:14px;"></p>
      <p style="margin-top:18px; font-size:13px;"><a href="/registro.html" style="color:var(--accent);">Crear cuenta nueva</a></p>
    </main>
  </div>

  <script>
    // Este es el patrón que reemplaza el "session" de Flask: al hacer
    // login, guardamos el token en localStorage. Cada función protegida
    // (cuentas.py, movimientos.py, etc.) lo exige en el header Authorization.
    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const mensaje = document.getElementById("mensaje");
      mensaje.textContent = "";

      try {
        const resp = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await resp.json();

        if (!resp.ok) {
          mensaje.textContent = data.error || "Error al iniciar sesión";
          return;
        }

        localStorage.setItem("np_token", data.token);
        localStorage.setItem("np_username", data.username);
        window.location.href = "/dashboard.html";
      } catch (err) {
        mensaje.textContent = "No se pudo conectar con el servidor.";
      }
    });
  </script>
</body>
</html>
